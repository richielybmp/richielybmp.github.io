<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist do Apartamento</title><style>body{font-family:system-ui;margin:auto;max-width:900px;padding:20px;background:#f5f6f8;color:#1f2937}section{background:white;padding:18px;margin:14px 0;border-radius:14px}label{display:block;padding:9px;border-bottom:1px solid #eee}input{margin-right:10px}#status{position:sticky;top:0;background:white;padding:14px;border-radius:12px;z-index:2}small{color:#6b7280}</style></head><body><h1>🏠 Checklist do Apartamento</h1><div id="status">Carregando…</div><div id="app"></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const config={apiKey:"AIzaSyBrM42lTWMXIgpwW8K_Yvxg55C5czPLi4Q",authDomain:"checklist-apartamento-1d938.firebaseapp.com",projectId:"checklist-apartamento-1d938",storageBucket:"checklist-apartamento-1d938.firebasestorage.app",messagingSenderId:"760643250733",appId:"1:760643250733:web:ae0e4c2170f5809566a4"};const data={"🧳 Kit de sobrevivência":['Papel higiênico','Sabonete','Shampoo','Condicionador','Pasta de dente','Escova de dente','Fio dental','Desodorante','Toalha de banho','Toalha de rosto','Chinelo','Roupa para dormir','Papel toalha','Lenços de papel'],"🧹 Limpeza":['Detergente','Esponja','Sabão em pó/líquido','Desinfetante','Água sanitária','Limpador multiuso','Limpa-vidros','Desengordurante','Álcool','Sacos de lixo','Panos de chão','Panos de limpeza','Flanela','Vassoura','Rodo','Pá de lixo','Balde','Luvas de limpeza'],"🍽️ Cozinha":['Água mineral','Copos','Pratos','Talheres','Canecas','Guardanapos','Pano de prato','Abridor de garrafa/latas','Faca','Tábua de corte','Potes plásticos','Papel-alumínio','Filme plástico','Café','Açúcar/adoçante','Sal','Óleo/azeite','Alimentos básicos'],"🔧 Ferramentas":['Chave Phillips','Chave de fenda','Alicate','Martelo','Fita isolante','Fita veda-rosca','Estilete','Tesoura','Trena','Parafusos e buchas','Pregos','Abraçadeiras','Extensão elétrica','Filtro de linha','Adaptadores de tomada','Lanterna','Pilhas','Fita adesiva forte'],"⚡ Elétrica":['Extensão','Filtro de linha','Carregadores','Carregador portátil','Lâmpadas reservas','Adaptadores de tomada','Cabo HDMI','Cabo de antena/coaxial','Pilhas AA/AAA'],"🛏️ Quarto":['Lençol','Fronha','Travesseiros','Cobertor/edredom','Cabides','Cesto para roupa suja','Sacos para roupas sujas','Ventilador, se necessário'],"🚿 Banheiro":['Papel higiênico','Saboneteira','Toalhas','Tapete','Escova sanitária','Lixeira','Sacos para lixeira','Desinfetante','Água sanitária','Rodo pequeno'],"🧺 Lavanderia":['Sabão para máquina de lavar','Amaciante','Tira-manchas','Cesto de roupa','Pregadores','Varal, se não houver','Cabides','Panos de chão','Balde','Vassoura','Rodo','Esponjas','Luvas'],"🧰 Primeiro mês":['Sacos de lixo grandes','Papel higiênico','Papel-toalha','Água','Extensão elétrica','Filtro de linha','Fita isolante','Fita veda-rosca','Lanterna','Pilhas','Tesoura','Estilete','Trena','Chaves de fenda/Phillips','Martelo','Alicate','Adaptadores de tomada','Panos','Balde','Detergente','Esponja','Desinfetante','Álcool','Sabão para roupa','Kit básico de primeiros socorros','Carregadores','Café','Copos descartáveis','Talheres descartáveis','Comida pronta/congelada'];const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let uid,items={};const status=m=>document.getElementById('status').textContent=m;function render(){const root=document.getElementById('app');root.innerHTML='';for(const[c,list]of Object.entries(data)){const s=document.createElement('section');s.innerHTML='<h2>'+c+' <small>'+list.length+' itens</small></h2>';list.forEach((x,i)=>{const id=c+'|'+i,l=document.createElement('label');l.innerHTML='<input type="checkbox">'+x;const cb=l.firstChild;cb.checked=!!items[id];cb.onchange=()=>{items[id]=cb.checked;setDoc(doc(db,'checklists',uid),{items},{merge:true}).then(()=>status('Salvo ✓')).catch(e=>status('❌ Erro ao salvar: '+e.code));};s.appendChild(l)});root.appendChild(s)}update()};function update(){const total=Object.values(data).reduce((a,x)=>a+x.length,0),done=Object.keys(items).filter(k=>items[k]).length;status(`Progresso: ${done}/${total} concluídos (${Math.round(done/total*100)}%)`)}signInAnonymously(auth).catch(e=>status('❌ Erro de autenticação: '+e.code+' — '+e.message));onAuthStateChanged(auth,u=>{if(!u)return;uid=u.uid;status('Conectado. Carregando checklist…');onSnapshot(doc(db,'checklists',uid),s=>{items=s.exists()?(s.data().items||{}):{};render()},e=>status('❌ Erro no Firestore: '+e.code+' — '+e.message))});</script></body></html>
