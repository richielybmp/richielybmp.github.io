<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist do Apartamento</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:auto;max-width:900px;padding:20px;background:#f5f6f8;color:#1f2937}h1{margin-bottom:6px}.hint{color:#6b7280;margin-bottom:18px}.status{position:sticky;top:8px;background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 10px #0001;z-index:2}section{background:#fff;padding:18px;margin:14px 0;border-radius:14px;box-shadow:0 2px 10px #0000000a}label{display:block;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer}label:last-child{border-bottom:0}input{width:18px;height:18px;margin-right:10px;vertical-align:middle}button{margin-top:10px;padding:9px 12px;border:0;border-radius:8px;cursor:pointer}</style></head><body><h1>🏠 Checklist do Apartamento</h1><div class="hint">Marque os itens conforme forem comprados ou levados. O progresso é salvo automaticamente e sincronizado entre dispositivos.</div><div id="status" class="status">Conectando ao checklist…</div><div id="app"></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyBrM42lTWMXIgpwW8K_Yvxg55C5czPLi4Q",authDomain:"checklist-apartamento-1d938.firebaseapp.com",projectId:"checklist-apartamento-1d938",storageBucket:"checklist-apartamento-1d938.firebasestorage.app",messagingSenderId:"760643250733",appId:"1:760643250733:web:ae0e4c2170f5809566a4"};const categories={"🧳 Kit de sobrevivência":['Papel higiênico','Sabonete','Shampoo','Condicionador','Pasta de dente','Escova de dente','Fio dental','Desodorante','Toalha de banho','Toalha de rosto','Chinelo','Roupa para dormir','Papel toalha','Lenços de papel'],"🧹 Limpeza":['Detergente','Esponja','Sabão em pó/líquido','Desinfetante','Água sanitária','Limpador multiuso','Limpa-vidros','Desengordurante','Álcool','Sacos de lixo','Panos de chão','Panos de limpeza','Flanela','Vassoura','Rodo','Pá de lixo','Balde','Luvas de limpeza'],"🍽️ Cozinha":['Água mineral','Copos','Pratos','Talheres','Canecas','Guardanapos','Pano de prato','Abridor de garrafa/latas','Faca','Tábua de corte','Potes plásticos','Papel-alumínio','Filme plástico','Café','Açúcar/adoçante','Sal','Óleo/azeite','Alimentos básicos'],"🔧 Ferramentas":['Chave Phillips','Chave de fenda','Alicate','Martelo','Fita isolante','Fita veda-rosca','Estilete','Tesoura','Trena','Parafusos e buchas','Pregos','Abraçadeiras','Extensão elétrica','Filtro de linha','Adaptadores de tomada','Lanterna','Pilhas','Fita adesiva forte'],"⚡ Elétrica":['Extensão','Filtro de linha','Carregadores','Carregador portátil','Lâmpadas reservas','Adaptadores de tomada','Cabo HDMI','Cabo de antena/coaxial','Pilhas AA/AAA'],"🛏️ Quarto":['Lençol','Fronha','Travesseiros','Cobertor/edredom','Cabides','Cesto para roupa suja','Sacos para roupas sujas','Ventilador, se necessário'],"🚿 Banheiro":['Papel higiênico','Saboneteira','Toalhas','Tapete','Escova sanitária','Lixeira','Sacos para lixeira','Desinfetante','Água sanitária','Rodo pequeno'],"🧺 Lavanderia":['Sabão para máquina de lavar','Amaciante','Tira-manchas','Cesto de roupa','Pregadores','Varal, se não houver','Cabides','Panos de chão','Balde','Vassoura','Rodo','Esponjas','Luvas'],"🧰 Primeiro mês":['Sacos de lixo grandes','Papel higiênico','Papel-toalha','Água','Extensão elétrica','Filtro de linha','Fita isolante','Fita veda-rosca','Lanterna','Pilhas','Tesoura','Estilete','Trena','Chaves de fenda/Phillips','Martelo','Alicate','Adaptadores de tomada','Panos','Balde','Detergente','Esponja','Desinfetante','Álcool','Sabão para roupa','Kit básico de primeiros socorros','Carregadores','Café','Copos descartáveis','Talheres descartáveis','Comida pronta/congelada']};const db=getFirestore(initializeApp(firebaseConfig));const ref=doc(db,'checklists','apartamento-principal');let items={};const status=m=>document.getElementById('status').textContent=m;function update(){const total=Object.values(categories).reduce((a,x)=>a+x.length,0),done=Object.values(items).filter(Boolean).length;status(`Progresso: ${done}/${total} concluídos (${Math.round(done/total*100)}%)`)}function render(){const root=document.getElementById('app');root.innerHTML='';for(const[c,list]of Object.entries(categories)){const s=document.createElement('section');s.innerHTML=`<h2>${c}</h2>`;list.forEach((x,i)=>{const id=c+'|'+i,l=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!items[id];l.append(cb,document.createTextNode(x));cb.onchange=async()=>{items[id]=cb.checked;update();try{await setDoc(ref,{items},{merge:true});status(`Progresso salvo ✓ ${Object.values(items).filter(Boolean).length}/${Object.values(categories).reduce((a,x)=>a+x.length,0)}`)}catch(e){status('❌ Erro ao salvar: '+e.code)}};s.appendChild(l)});root.appendChild(s)}update()}onSnapshot(ref,s=>{items=s.exists()?(s.data().items||{}):{};render()},e=>status('❌ Erro no Firestore: '+e.code+' — '+e.message));</script></body></html>
