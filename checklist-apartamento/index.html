<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Checklist do Apartamento</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f6f8;color:#1f2937}.wrap{max-width:900px;margin:auto;padding:18px 12px 50px}h1{font-size:26px;margin:4px 0 4px}.subtitle{color:#6b7280;margin-bottom:14px}.status{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(8px);padding:12px 0}.statusbox{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 12px #0001}.progress{font-weight:700;display:flex;justify-content:space-between;gap:8px}.bar{height:8px;background:#e5e7eb;border-radius:99px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#2563eb;transition:.2s}.category{background:#fff;border-radius:14px;margin:10px 0;box-shadow:0 2px 10px #0000000a;overflow:hidden}.cathead{width:100%;border:0;background:#fff;padding:16px;text-align:left;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:16px;font-weight:700}.cathead .left{display:flex;align-items:center;gap:10px}.arrow{transition:.2s}.category.open .arrow{transform:rotate(90deg)}.catcount{font-size:12px;color:#6b7280;font-weight:500}.items{display:none;padding:0 14px 10px}.category.open .items{display:block}.item{display:flex;align-items:flex-start;gap:10px;padding:11px 3px;border-top:1px solid #eef0f3;cursor:pointer}.item input{width:19px;height:19px;margin-top:1px;accent-color:#2563eb;flex:none}.text{flex:1}.name{display:block}.item.done .name{text-decoration:line-through;color:#6b7280}.time{display:block;color:#9ca3af;font-size:11px;margin-top:3px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{border:0;border-radius:9px;padding:8px 10px;font-weight:600;cursor:pointer}.reset{background:#e5e7eb;color:#374151}@media(max-width:600px){.wrap{ ex:1;border:0;border-radius:10px;padding:10px;background:#e5e7eb;color:#374151;font-weight:700;cursor:pointer}.marketview.active{background:#dbeafe;color:#1d4ed8}.markettools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.markettools button{border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer;background:#2563eb;color:white}.markettools button.secondary{background:#e5e7eb;color:#374151}.marketrow{border-radius:0}.marketrow:last-child{border-bottom:0}.marketreset{margin-top:10px}@media(max-width:480px){.marketrow{gap:7px}.quantity{width:70px}.unit{width:82px}.marketname strong{font-size:14px}}@media(max-width:600px){.tabs{gap:6px}.tab{padding:11px 5px;font-size:13px}}</style></head><body><div class="wrap"><h1>🛒 Controle de compras</h1><div class="subtitle">Lista sincronizada pelo Firebase entre seus dispositivos.</div><nav class="tabs"><button class="tab active" data-tab="market">🛒 Supermercado</button><button class="tab" data-tab="apartment">🏠 Apartamento</button></nav><section id="marketPane" class="pane active"><div class="summary"><div class="pill"><span>Falta comprar</span><strong id="buyCount">16 itens</strong></div><div class="pill"><span>Total a comprar</span><strong id="buyTotal">R$ 0,00</strong></div></div><nav class="marketviews"><button class="marketview active" data-market-view="categories">Por categoria</button><button class="marketview" data-market-view="all">Todos os itens</button></nav><div class="markettools"><button id="addCategory">＋ Nova categoria</button><button id="addProduct" class="secondary">＋ Novo produto</button></div><div id="marketApp"></div><div class="actions marketreset"><button class="reset" id="marketReset">Zerar valores unitários</button></div></section><section id="apartmentPane" class="pane"><div class="status"><div class="statusbox"><div class="progress"><span>Progresso</span><span id="progressText">Carregando…</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="actions"><button class="reset" id="reset">Desmarcar tudo</button></div></div></div><main id="app"></main></section></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const config={apiKey:"AIzaSyBrM42lTWMXIgpwW8K_Yvxg55C5czPLi4Q",authDomain:"checklist-apartamento-1d938.firebaseapp.com",projectId:"checklist-apartamento-1d938",storageBucket:"checklist-apartamento-1d938.firebasestorage.app",messagingSenderId:"760643250733",appId:"1:760643250733:web:ae0e4c2170f5809566a4"};const data={"🧳 Kit de sobrevivência":['Papel higiênico','Sabonete','Shampoo','Condicionador','Pasta de dente','Escova de dente','Fio dental','Desodorante','Toalha de banho','Toalha de rosto','Chinelo','Roupa para dormir','Papel toalha','Lenços de papel'],"🧹 Limpeza":['Detergente','Esponja','Sabão em pó/líquido','Desinfetante','Água sanitária','Limpador multiuso','Limpa-vidros','Desengordurante','Álcool','Sacos de lixo','Panos de chão','Panos de limpeza','Flanela','Vassoura','Rodo','Pá de lixo','Balde','Luvas de limpeza'],"🍽️ Cozinha":['Água mineral','Copos','Pratos','Talheres','Canecas','Guardanapos','Pano de prato','Abridor de garrafa/latas','Faca','Tábua de corte','Potes plásticos','Papel-alumínio','Filme plástico','Café','Açúcar/adoçante','Sal','Óleo/azeite','Alimentos básicos'],"🔧 Ferramentas":['Chave Phillips','Chave de fenda','Alicate','Martelo','Fita isolante','Fita veda-rosca','Estilete','Tesoura','Trena','Parafusos e buchas','Pregos','Abraçadeiras','Extensão elétrica','Filtro de linha','Adaptadores de tomada','Lanterna','Pilhas','Fita adesiva forte'],"⚡ Elétrica":['Extensão','Filtro de linha','Carregadores','Carregador portátil','Lâmpadas reservas','Adaptadores de tomada','Cabo HDMI','Cabo de antena/coaxial','Pilhas AA/AAA'],"🛏️ Quarto":['Lençol','Fronha','Travesseiros','Cobertor/edredom','Cabides','Cesto para roupa suja','Sacos para roupas sujas','Ventilador, se necessário'],"🚿 Banheiro":['Papel higiênico','Saboneteira','Toalhas','Tapete','Escova sanitária','Lixeira','Sacos para lixeira','Desinfetante','Água sanitária','Rodo pequeno'],"🧺 Lavanderia":['Sabão para máquina de lavar','Amaciante','Tira-manchas','Cesto de roupa','Pregadores','Varal, se não houver','Cabides','Panos de chão','Balde','Vassoura','Rodo','Esponjas','Luvas'],"🧰 Primeiro mês":['Sacos de lixo grandes','Papel higiênico','Papel-toalha','Água','Extensão elétrica','Filtro de linha','Fita isolante','Fita veda-rosca','Lanterna','Pilhas','Tesoura','Estilete','Trena','Chaves de fenda/Phillips','Martelo','Alicate','Adaptadores de tomada','Panos','Balde','Detergente','Esponja','Desinfetante','Álcool','Sabão para roupa','Kit básico de primeiros socorros','Carregadores','Café','Copos descartáveis','Talheres descartáveis','Comida pronta/congelada']};const app=initializeApp(config),db=getFirestore(app),ref=doc(db,'checklists','apartamento-principal');let items={};const status=document.getElementById('progressText');function fmt(ts){if(!ts)return'';const d=new Date(ts);return'Concluído em '+d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}function update(){const total=Object.values(data).reduce((a,x)=>a+x.length,0),done=Object.values(items).filter(x=>x&&x.done).length;status.textContent=`${done}/${total} concluídos (${Math.round(done/total*100)}%)`;document.getElementById('fill').style.width=Math.round(done/total*100)+'%'}function render(){const root=document.getElementById('app');const openCategories=new Set([...root.querySelectorAll('.category.open')].map(s=>s.dataset.category));root.innerHTML='';for(const[c,list]of Object.entries(data)){const section=document.createElement('section');section.className='category';section.dataset.category=c;if(openCategories.has(c))section.classList.add('open');const head=document.createElement('button');head.className='cathead';head.innerHTML=`<span class="left"><span class="arrow">›</span><span>${c}</span></span><span class="catcount">${list.length} itens</span>`;head.onclick=()=>section.classList.toggle('open');const box=document.createElement('div');box.className='items';list.forEach((name,i)=>{const id=c+'|'+i,val=items[id]||{},label=document.createElement('label');label.className='item'+(val.done?' done':'');label.innerHTML=`<input type="checkbox" ${val.done?'checked':''}><span class="text"><span class="name">${name}</span><span class="time">${val.done?fmt(val.completedAt):''}</span></span>`;const cb=label.querySelector('input');cb.onchange=()=>{items[id]=cb.checked?{done:true,completedAt:new Date().toISOString()}:{done:false,completedAt:null};setDoc(ref,{items},{merge:true}).then(update).catch(e=>alert('Erro ao salvar: '+e.code))};box.appendChild(label)});section.append(head,box);root.appendChild(section)}update()}onSnapshot(ref,s=>{const d=s.exists()?s.data():{};items=d.items||{};marketItems=d.supermarketItems||{};marketCategories=d.supermarketCategories||[];marketProducts=d.supermarketProducts||[];render();marketRender()},e=>{status.textContent='Erro: '+e.code});

async function loadMarketDefaults(){const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const buf=await new Response(stream).arrayBuffer();return JSON.parse(new TextDecoder().decode(buf)).map(([id,name,qty,category,have])=>({id,name,qty,category,have,unitValue:0,markedAt:null}));}
let marketDefaults=[],marketItems={},marketCategories=[],marketProducts=[];
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function formatBRLInput(value){return Number(value||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseBRLInput(value){const digits=String(value||'').replace(/\D/g,'');return digits?Number(digits)/100:0;}
function marketStamp(ts){if(!ts)return'Carimbo ainda não registrado';const d=new Date(ts);return'Atualizado em '+d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function allMarketProducts(){return [...marketDefaults,...marketProducts].map(p=>({...p,...(marketItems[p.id]||{}),id:p.id,name:p.name,qty:marketItems[p.id]?.qty ?? p.qty ?? '',category:p.category,have:marketItems[p.id]?.have ?? p.have ?? false,unitValue:marketItems[p.id]?.unitValue ?? p.unitValue ?? 0,markedAt:marketItems[p.id]?.markedAt ?? p.markedAt ?? null}));}
let marketView='categories';
function createMarketRow(p){const row=document.createElement('div');row.className='marketrow'+(p.have?' have':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!p.have;check.setAttribute('aria-label','Já tenho '+p.name);const name=document.createElement('div');name.className='marketname';const strong=document.createElement('strong');strong.textContent=p.name;const time=document.createElement('span');time.className='time';time.textContent=marketStamp(p.markedAt);name.append(strong,time);const quantity=document.createElement('div');quantity.className='quantity';const qtyLabel=document.createElement('label');qtyLabel.textContent='Qtde';const qtyInput=document.createElement('input');qtyInput.type='text';qtyInput.placeholder='Ex.: 2 kg';qtyInput.value=p.qty||'';qtyInput.setAttribute('aria-label','Quantidade de '+p.name);quantity.append(qtyLabel,qtyInput);const unit=document.createElement('div');unit.className='unit';const label=document.createElement('label');label.textContent='Valor unitário (R$)';const input=document.createElement('input');input.type='text';input.inputMode='numeric';input.placeholder='0,00';input.value=Number(p.unitValue||0)>0?formatBRLInput(p.unitValue):'';input.setAttribute('aria-label','Valor unitário em reais de '+p.name);unit.append(label,input);row.append(check,name,quantity,unit);check.onchange=()=>saveMarket(p.id,{have:check.checked,unitValue:Number(p.unitValue||0),qty:qtyInput.value,markedAt:new Date().toISOString()});qtyInput.onchange=()=>saveMarket(p.id,{have:!!p.have,unitValue:parseBRLInput(input.value),qty:qtyInput.value,markedAt:p.markedAt||null});input.oninput=()=>{const digits=input.value.replace(/\D/g,'');input.value=digits?formatBRLInput(Number(digits)/100):'';};input.onchange=()=>saveMarket(p.id,{have:!!p.have,unitValue:parseBRLInput(input.value),qty:qtyInput.value,markedAt:p.markedAt||null});return row;}
function marketRender(){const root=document.getElementById('marketApp');root.innerHTML='';const merged=allMarketProducts();const categories=[...new Set([...marketDefaults.map(p=>p.category),...marketCategories,...marketProducts.map(p=>p.category)])];const ordered=merged.sort((a,b)=>Number(a.have)-Number(b.have)||(marketView==='all'?a.category.localeCompare(b.category,'pt-BR'):0)||a.name.localeCompare(b.name,'pt-BR'));
if(marketView==='all'){const list=document.createElement('section');list.className='marketsection open';const box=document.createElement('div');box.className='marketitems';ordered.forEach(p=>box.appendChild(createMarketRow(p)));list.appendChild(box);root.appendChild(list);}else{for(const category of categories){const products=ordered.filter(p=>p.category===category);const section=document.createElement('section');section.className='marketsection';section.dataset.category=category;const head=document.createElement('button');head.className='markethead';head.innerHTML='<span class="left"><span class="arrow">›</span><span></span></span><span class="catcount"></span>';head.querySelector('.left span:last-child').textContent=category;head.querySelector('.catcount').textContent=products.filter(p=>!p.have).length+' para comprar · '+products.length+' itens';head.onclick=()=>section.classList.toggle('open');const box=document.createElement('div');box.className='marketitems';products.forEach(p=>box.appendChild(createMarketRow(p)));section.append(head,box);root.appendChild(section);}}
const pending=merged.filter(p=>!p.have);document.getElementById('buyCount').textContent=pending.length+' itens';document.getElementById('buyTotal').textContent=money(pending.reduce((sum,p)=>sum+Math.max(0,Number(p.unitValue)||0),0));}
document.querySelectorAll('[data-market-view]').forEach(btn=>btn.onclick=()=>{marketView=btn.dataset.marketView;document.querySelectorAll('[data-market-view]').forEach(b=>b.classList.toggle('active',b===btn));marketRender()});
async function saveMarket(id,patch){marketItems={...marketItems,[id]:{...(marketItems[id]||{}),...patch}};marketRender();try{await setDoc(ref,{supermarketItems:marketItems},{merge:true})}catch(e){alert('Erro ao salvar no Firebase: '+e.code)}}
async function saveMarketStructure(){try{await setDoc(ref,{supermarketCategories:marketCategories,supermarketProducts:marketProducts},{merge:true});marketRender()}catch(e){alert('Erro ao salvar no Firebase: '+e.code)}}
document.getElementById('addCategory').onclick=async()=>{const name=prompt('Nome da nova categoria/seção:');if(!name||!name.trim())return;const clean=name.trim();const exists=[...new Set([...marketDefaults.map(p=>p.category),...marketCategories,...marketProducts.map(p=>p.category)])].some(c=>c.toLocaleLowerCase('pt-BR')===clean.toLocaleLowerCase('pt-BR'));if(exists){alert('Essa categoria já existe.');return}marketCategories=[...marketCategories,clean];await saveMarketStructure()};
document.getElementById('addProduct').onclick=async()=>{const name=prompt('Nome do novo produto:');if(!name||!name.trim())return;const categories=[...new Set([...marketDefaults.map(p=>p.category),...marketCategories,...marketProducts.map(p=>p.category)])];if(!categories.length){alert('Crie uma categoria primeiro.');return}const choice=prompt('Digite o número da categoria para associar o produto:\n'+categories.map((c,i)=>(i+1)+'. '+c).join('\n'));const index=Number(choice)-1;if(!Number.isInteger(index)||index<0||index>=categories.length){if(choice!==null)alert('Categoria inválida.');return}const qty=prompt('Quantidade/unidade (opcional, ex.: 1 kg ou 2 unidades):')||'';marketProducts=[...marketProducts,{id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:name.trim(),qty:qty.trim(),category:categories[index],have:false,unitValue:0,markedAt:null}];await saveMarketStructure()};
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));document.getElementById('marketPane').classList.toggle('active',btn.dataset.tab==='market');document.getElementById('apartmentPane').classList.toggle('active',btn.dataset.tab==='apartment')});
document.getElementById('marketReset').onclick=async()=>{if(confirm('Zerar todos os valores unitários?')){marketItems={...marketItems};for(const p of marketDefaults)marketItems[p.id]={...(marketItems[p.id]||{}),unitValue:0};marketRender();try{await setDoc(ref,{supermarketItems:marketItems},{merge:true})}catch(e){alert('Erro ao salvar no Firebase: '+e.code)}}};

loadMarketDefaults().then(d=>{marketDefaults=d;marketRender()}).catch(e=>console.error('Falha ao carregar lista do supermercado',e));
document.getElementById('reset').onclick=()=>{if(confirm('Desmarcar todos os itens?')){const next={};Object.keys(items).forEach(k=>next[k]={done:false,completedAt:null});items=next;setDoc(ref,{items},{merge:true})}};</script></body></html>
