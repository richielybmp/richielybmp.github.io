<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Checklist do Apartamento</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f6f8;color:#1f2937}.wrap{max-width:900px;margin:auto;padding:18px 12px 50px}h1{font-size:26px;margin:4px 0 4px}.subtitle{color:#6b7280;margin-bottom:14px}.status{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(8px);padding:12px 0}.statusbox{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 12px #0001}.progress{font-weight:700;display:flex;justify-content:space-between;gap:8px}.bar{height:8px;background:#e5e7eb;border-radius:99px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#2563eb;transition:.2s}.category{background:#fff;border-radius:14px;margin:10px 0;box-shadow:0 2px 10px #0000000a;overflow:hidden}.cathead{width:100%;border:0;background:#fff;padding:16px;text-align:left;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:16px;font-weight:700}.cathead .left{display:flex;align-items:center;gap:10px}.arrow{transition:.2s}.category.open .arrow{transform:rotate(90deg)}.catcount{font-size:12px;color:#6b7280;font-weight:500}.items{display:none;padding:0 14px 10px}.category.open .items{display:block}.item{display:flex;align-items:flex-start;gap:10px;padding:11px 3px;border-top:1px solid #eef0f3;cursor:pointer}.item input{width:19px;height:19px;margin-top:1px;accent-color:#2563eb;flex:none}.text{flex:1}.name{display:block}.item.done .name{text-decoration:line-through;color:#6b7280}.time{display:block;color:#9ca3af;font-size:11px;margin-top:3px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{border:0;border-radius:9px;padding:8px 10px;font-weight:600;cursor:pointer}.reset{background:#e5e7eb;color:#374151}@media(max-width:600px){.wrap{padding:14px 9px 35px}h1{font-size:23px}.cathead{padding:15px 13px}.items{padding:0 10px 8px}.item{padding:12px 2px}.statusbox{padding:11px}}</style></head><body><div class="wrap"><h1>🏠 Checklist do Apartamento</h1><div class="subtitle">Marque os itens conforme forem concluídos. O horário fica registrado automaticamente.</div><div class="status"><div class="statusbox"><div class="progress"><span>Progresso</span><span id="progressText">Carregando…</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="actions"><button class="reset" id="reset">Desmarcar tudo</button></div></div></div><main id="app"></main></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const config={apiKey:"AIzaSyBrM42lTWMXIgpwW8K_Yvxg55C5czPLi4Q",authDomain:"checklist-apartamento-1d938.firebaseapp.com",projectId:"checklist-apartamento-1d938",storageBucket:"checklist-apartamento-1d938.firebasestorage.app",messagingSenderId:"760643250733",appId:"1:760643250733:web:ae0e4c2170f5809566a4"};const data={"🧳 Kit de sobrevivência":['Papel higiênico','Sabonete','Shampoo','Condicionador','Pasta de dente','Escova de dente','Fio dental','Desodorante','Toalha de banho','Toalha de rosto','Chinelo','Roupa para dormir','Papel toalha','Lenços de papel'],"🧹 Limpeza":['Detergente','Esponja','Sabão em pó/líquido','Desinfetante','Água sanitária','Limpador multiuso','Limpa-vidros','Desengordurante','Álcool','Sacos de lixo','Panos de chão','Panos de limpeza','Flanela','Vassoura','Rodo','Pá de lixo','Balde','Luvas de limpeza'],"🍽️ Cozinha":['Água mineral','Copos','Pratos','Talheres','Canecas','Guardanapos','Pano de prato','Abridor de garrafa/latas','Faca','Tábua de corte','Potes plásticos','Papel-alumínio','Filme plástico','Café','Açúcar/adoçante','Sal','Óleo/azeite','Alimentos básicos'],"🔧 Ferramentas":['Chave Phillips','Chave de fenda','Alicate','Martelo','Fita isolante','Fita veda-rosca','Estilete','Tesoura','Trena','Parafusos e buchas','Pregos','Abraçadeiras','Extensão elétrica','Filtro de linha','Adaptadores de tomada','Lanterna','Pilhas','Fita adesiva forte'],"⚡ Elétrica":['Extensão','Filtro de linha','Carregadores','Carregador portátil','Lâmpadas reservas','Adaptadores de tomada','Cabo HDMI','Cabo de antena/coaxial','Pilhas AA/AAA'],"🛏️ Quarto":['Lençol','Fronha','Travesseiros','Cobertor/edredom','Cabides','Cesto para roupa suja','Sacos para roupas sujas','Ventilador, se necessário'],"🚿 Banheiro":['Papel higiênico','Saboneteira','Toalhas','Tapete','Escova sanitária','Lixeira','Sacos para lixeira','Desinfetante','Água sanitária','Rodo pequeno'],"🧺 Lavanderia":['Sabão para máquina de lavar','Amaciante','Tira-manchas','Cesto de roupa','Pregadores','Varal, se não houver','Cabides','Panos de chão','Balde','Vassoura','Rodo','Esponjas','Luvas'],"🧰 Primeiro mês":['Sacos de lixo grandes','Papel higiênico','Papel-toalha','Água','Extensão elétrica','Filtro de linha','Fita isolante','Fita veda-rosca','Lanterna','Pilhas','Tesoura','Estilete','Trena','Chaves de fenda/Phillips','Martelo','Alicate','Adaptadores de tomada','Panos','Balde','Detergente','Esponja','Desinfetante','Álcool','Sabão para roupa','Kit básico de primeiros socorros','Carregadores','Café','Copos descartáveis','Talheres descartáveis','Comida pronta/congelada']};const app=initializeApp(config),db=getFirestore(app),ref=doc(db,'checklists','apartamento-principal');let items={};const status=document.getElementById('progressText');function fmt(ts){if(!ts)return'';const d=new Date(ts);return'Concluído em '+d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}function update(){const total=Object.values(data).reduce((a,x)=>a+x.length,0),done=Object.values(items).filter(x=>x&&x.done).length;status.textContent=`${done}/${total} concluídos (${Math.round(done/total*100)}%)`;document.getElementById('fill').style.width=Math.round(done/total*100)+'%'}function render(){const root=document.getElementById('app');const openCategories=new Set([...root.querySelectorAll('.category.open')].map(s=>s.dataset.category));root.innerHTML='';for(const[c,list]of Object.entries(data)){const section=document.createElement('section');section.className='category';section.dataset.category=c;if(openCategories.has(c))section.classList.add('open');const head=document.createElement('button');head.className='cathead';head.innerHTML=`<span class="left"><span class="arrow">›</span><span>${c}</span></span><span class="catcount">${list.length} itens</span>`;head.onclick=()=>section.classList.toggle('open');const box=document.createElement('div');box.className='items';list.forEach((name,i)=>{const id=c+'|'+i,val=items[id]||{},label=document.createElement('label');label.className='item'+(val.done?' done':'');label.innerHTML=`<input type="checkbox" ${val.done?'checked':''}><span class="text"><span class="name">${name}</span><span class="time">${val.done?fmt(val.completedAt):''}</span></span>`;const cb=label.querySelector('input');cb.onchange=()=>{items[id]=cb.checked?{done:true,completedAt:new Date().toISOString()}:{done:false,completedAt:null};setDoc(ref,{items},{merge:true}).then(update).catch(e=>alert('Erro ao salvar: '+e.code))};box.appendChild(label)});section.append(head,box);root.appendChild(section)}update()}onSnapshot(ref,s=>{items=s.exists()?s.data().items||{}:{};render()},e=>{status.textContent='Erro: '+e.code});document.getElementById('reset').onclick=()=>{if(confirm('Desmarcar todos os itens?')){const next={};Object.keys(items).forEach(k=>next[k]={done:false,completedAt:null});items=next;setDoc(ref,{items},{merge:true})}};</script></body></html>
